[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "cit-tuya-smart-plug"
version = "0.1.0"
description = "Local-first Tuya-compatible smart-plug adapter for the CIT Interaction Fabric"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
  "cit-protocol",
  "websockets==17.0.1",
]

[project.optional-dependencies]
lan = ["tinytuya==1.20.0"]

[project.scripts]
cit-tuya-smart-plug = "cit_tuya_smart_plug.__main__:main"

[tool.uv.sources]
cit-protocol = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/cit_tuya_smart_plug"]
