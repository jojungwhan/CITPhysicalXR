[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "cit-tello"
version = "0.1.0"
description = "Independent CIT Interaction Fabric adapter for DJI/Ryze Tello via Brain2Devices"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
  "cit-integration-sdk",
  "cit-protocol",
]

[project.scripts]
cit-tello = "cit_tello.__main__:main"

[tool.uv.sources]
cit-integration-sdk = { workspace = true }
cit-protocol = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/cit_tello"]
