[project]
name = "cit-physical-xr-workspace"
version = "0.0.0"
description = "Development workspace for CIT Physical XR Studio"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "cit-device-simulator",
  "cit-lego-pybricks",
  "cit-robomaster-leap",
  "cit-runtime",
  "cit-protocol",
  "cit-safety-core",
  "cit-student-sdk",
  "cit-test-harness",
]

[dependency-groups]
dev = [
  "anyio==4.14.2",
  "build==1.5.0",
  "datamodel-code-generator==0.73.0",
  "hatchling==1.32.0",
  "httpx2==2.10.0",
  "jsonschema[format-nongpl]==4.26.0",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pyyaml==6.0.3",
  "ruff==0.16.3",
  "types-pyyaml==6.0.12.20260815",
  "types-jsonschema==4.26.0.20260518",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "adapters/lego-pybricks",
  "adapters/robomaster-leap",
  "apps/runtime-py",
  "packages/device-simulator",
  "packages/protocol-py",
  "packages/safety-core",
  "packages/student-sdk-py",
  "packages/test-harness",
]

[tool.uv.sources]
cit-device-simulator = { workspace = true }
cit-lego-pybricks = { workspace = true }
cit-robomaster-leap = { workspace = true }
cit-runtime = { workspace = true }
cit-protocol = { workspace = true }
cit-safety-core = { workspace = true }
cit-student-sdk = { workspace = true }
cit-test-harness = { workspace = true }

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["adapters", "packages", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["packages/protocol-py/src/cit_protocol/generated.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["adapters", "apps", "packages", "tests"]
exclude = ["packages/protocol-py/src/cit_protocol/generated.py"]

# `pybricksdev` is an optional hardware dependency (see
# adapters/lego-pybricks/pyproject.toml). It is deliberately absent from the
# default environment, so the one module that imports it has no stubs to check.
[[tool.mypy.overrides]]
module = ["pybricksdev.*"]
ignore_missing_imports = true
