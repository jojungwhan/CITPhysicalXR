[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "cit-device-simulator"
version = "0.0.0"
description = "In-memory fake device adapters for CIT Physical XR contract tests"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
  "cit-protocol",
  "cit-safety-core",
]

[tool.uv.sources]
cit-protocol = { workspace = true }
cit-safety-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/cit_device_simulator"]
