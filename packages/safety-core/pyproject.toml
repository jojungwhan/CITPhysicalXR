[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "cit-safety-core"
version = "0.0.0"
description = "Fail-closed Milestone 0 safety, lease, and command-ledger contracts"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
  "cit-protocol",
]

[tool.uv.sources]
cit-protocol = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/cit_safety"]
