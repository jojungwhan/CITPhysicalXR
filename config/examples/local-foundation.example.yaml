    paths:
      windows: 'D:\dev\robomaster-gesture-control-reference'
    expectedRevision: "e5a94865451dc8a9a266bb9223f8ed090ac11681"
    licenseStatus: owner-private-unlicensed
  robomasterCourse:
    kind: git
    paths:
      windows: 'D:\dev\robomasterCITCourse'
    expectedRevision: "2f54bc7f2de6925b1e388632c45cb4dd7296d660"
    licenseStatus: owner-private-unlicensed

externalEnvironments:
  robomasterS1:
