name: Foundation CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 10.28.2
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.17.0
          cache: pnpm

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.4.30
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install locked workspaces
        run: |
          pnpm install --frozen-lockfile
          uv sync --all-packages --frozen

      - name: Verify generated files and schemas
        run: |
          pnpm generate:check
          pnpm schema:check
          pnpm quest:check
          pnpm secret:check

      - name: Check formatting, lint, and types
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck

      - name: Build TypeScript and Python packages
        run: |
          pnpm build
          uv build --package cit-protocol
          uv build --package cit-safety-core
          uv build --package cit-device-simulator
          uv build --package cit-integration-sdk
          uv build --package cit-test-harness
          uv build --package cit-runtime
          uv build --package cit-brain2devices-demo
          uv build --package cit-lego-pybricks
          uv build --package cit-matter-smart-plug
          uv build --package cit-mindwave-mobile2
          uv build --package cit-robomaster-leap
          uv build --package cit-tello

      - name: Run tests and compliance gates
        run: |
          pnpm test
          pnpm license:check
          pnpm sbom
