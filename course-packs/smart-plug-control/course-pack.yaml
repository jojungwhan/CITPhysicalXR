schemaVersion: "1.0"
coursePackId: smart-plug-control
version: 1.0.0
displayName: Tuya / Gosund smart-plug control
description: >-
  Assigns an approved Tuya-LAN-compatible smart plug to the classroom_plug
  role for deterministic instructor on/off control.

roles:
  - role: classroom_plug
    oneOfCapabilities:
      - power.switch.set
    optional: false

flows: []
safetyProfile: classroom-smart-plug
simulatorRequired: true
assessmentEvents:
  - power.switch.state
fallbackBehavior: >-
  Drive the approved nonessential classroom load to off when the adapter,
  session, or Fabric stops.
