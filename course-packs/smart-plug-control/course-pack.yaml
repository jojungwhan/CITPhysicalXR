schemaVersion: "1.0"
coursePackId: smart-plug-control
version: 1.0.0
displayName: Classroom smart-plug control
description: >-
  Assigns an approved local Matter smart plug to the classroom_plug role for
  deterministic instructor on/off control without a proprietary cloud account.

roles:
  - role: classroom_plug
    ioType: output
    oneOfCapabilities:
      - power.switch.set
    optional: false

flows: []
safetyProfile: classroom-smart-plug
simulatorRequired: true
assessmentEvents:
  - power.switch.state
fallbackBehavior: >-
  Drive the approved nonessential classroom load to off when the adapter,
  session, or Fabric stops.
