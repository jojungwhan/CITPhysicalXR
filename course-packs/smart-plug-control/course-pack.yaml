schemaVersion: "1.0"
coursePackId: smart-plug-control
version: 1.1.0
displayName: Classroom smart-plug control
description: >-
  Assigns up to eight approved local Matter smart plugs to independent logical
  roles for deterministic instructor on/off control without a proprietary
  cloud account.

roles:
  - role: classroom_plug
    ioType: output
    oneOfCapabilities:
      - power.switch.set
    optional: false

  - role: classroom_plug_2
    ioType: output
    oneOfCapabilities:
      - power.switch.set
    optional: true

  - role: classroom_plug_3
    ioType: output
    oneOfCapabilities:
      - power.switch.set
    optional: true

  - role: classroom_plug_4
    ioType: output
    oneOfCapabilities:
      - power.switch.set
    optional: true

  - role: classroom_plug_5
    ioType: output
    oneOfCapabilities:
      - power.switch.set
    optional: true

  - role: classroom_plug_6
    ioType: output
    oneOfCapabilities:
      - power.switch.set
    optional: true

  - role: classroom_plug_7
    ioType: output
    oneOfCapabilities:
      - power.switch.set
    optional: true

  - role: classroom_plug_8
    ioType: output
    oneOfCapabilities:
      - power.switch.set
    optional: true

flows: []
safetyProfile: classroom-smart-plug
simulatorRequired: true
assessmentEvents:
  - power.switch.state
fallbackBehavior: >-
  Drive the approved nonessential classroom load to off when the adapter,
  session, or Fabric stops.
