schemaVersion: "1.0"
coursePackId: glasses-device-control
version: 1.3.0
displayName: Glasses device control
description: >-
  Routes explicitly confirmed, structured G2 or Meta voice and menu commands
  to tutor-assigned robots, approved local smart plugs, and the separately
  armed ordered Tello fleet. Each route is selected from an explicit role
  allowlist and filtered by the output capability it actually consumes.

roles:
  - role: glasses_input_1
    ioType: input
    oneOfCapabilities: [interaction.intent.device_control]
    optional: false

  - role: glasses_input_2
    ioType: input
    oneOfCapabilities: [interaction.intent.device_control]
    optional: true

  - role: ground_output_1
    ioType: output
    oneOfCapabilities:
      &ground-capabilities [
        mobility.ground.nudge,
        mobility.ground.demonstration.start,
        robot.light.set,
      ]
    optional: true

  - role: ground_output_2
    ioType: output
    oneOfCapabilities: *ground-capabilities
    optional: true

  - role: ground_output_3
    ioType: output
    oneOfCapabilities: *ground-capabilities
    optional: true

  - role: ground_output_4
    ioType: output
    oneOfCapabilities: *ground-capabilities
    optional: true

  - role: ground_output_5
    ioType: output
    oneOfCapabilities: *ground-capabilities
    optional: true

  - role: ground_output_6
    ioType: output
    oneOfCapabilities: *ground-capabilities
    optional: true

  - role: ground_output_7
    ioType: output
    oneOfCapabilities: *ground-capabilities
    optional: true

  - role: ground_output_8
    ioType: output
    oneOfCapabilities: *ground-capabilities
    optional: true

  - role: power_output_1
    ioType: output
    oneOfCapabilities: &power-capabilities [power.switch.set]
    optional: true

  - role: power_output_2
    ioType: output
    oneOfCapabilities: *power-capabilities
    optional: true

  - role: power_output_3
    ioType: output
    oneOfCapabilities: *power-capabilities
    optional: true

  - role: power_output_4
    ioType: output
    oneOfCapabilities: *power-capabilities
    optional: true

  - role: power_output_5
    ioType: output
    oneOfCapabilities: *power-capabilities
    optional: true

  - role: power_output_6
    ioType: output
    oneOfCapabilities: *power-capabilities
    optional: true

  - role: power_output_7
    ioType: output
    oneOfCapabilities: *power-capabilities
    optional: true

  - role: power_output_8
    ioType: output
    oneOfCapabilities: *power-capabilities
    optional: true

  - role: fleet_sequence_controller
    ioType: output
    oneOfCapabilities: [mobility.flight.fleet_sequence.start]
    allOfCapabilities: [mobility.flight.fleet_sequence.stop]
    optional: true

flows:
  - flowId: glasses-ground-forward
    version: 1
    trigger:
      event: interaction.intent.device_control
      minimumConfidence: 1.0
      debounceMs: 250
      payloadEquals:
        target: ground_outputs
        action: forward
        confirmed: true
    command: &ground-forward-command
      action: mobility.ground.nudge
      fixedParameters: { direction: forward }
      parameterBindings: []
    target: &ground-nudge-group
      roles:
        &ground-roles [
          ground_output_1,
          ground_output_2,
          ground_output_3,
          ground_output_4,
          ground_output_5,
          ground_output_6,
          ground_output_7,
          ground_output_8,
        ]
      requiredCapability: mobility.ground.nudge
    guards: &ground-guards
      - session_is_active
      - role_is_assigned
      - target_is_connected
      - target_is_armed
      - instructor_override_is_clear
    safetyProfile: classroom-drone-monitoring
    outputRoles: *ground-roles
    parallelGroup: glasses-ground-control
    enabled: true

  - flowId: glasses-ground-backward
    version: 1
    trigger:
      event: interaction.intent.device_control
      minimumConfidence: 1.0
      debounceMs: 250
      payloadEquals:
        target: ground_outputs
        action: backward
        confirmed: true
    command: &ground-backward-command
      action: mobility.ground.nudge
      fixedParameters: { direction: backward }
      parameterBindings: []
    target: *ground-nudge-group
    guards: *ground-guards
    safetyProfile: classroom-drone-monitoring
    outputRoles: *ground-roles
    parallelGroup: glasses-ground-control
    enabled: true

  - flowId: glasses-ground-left
    version: 1
    trigger:
      event: interaction.intent.device_control
      minimumConfidence: 1.0
      debounceMs: 250
      payloadEquals:
        target: ground_outputs
        action: left
        confirmed: true
    command: &ground-left-command
      action: mobility.ground.nudge
      fixedParameters: { direction: left }
      parameterBindings: []
    target: *ground-nudge-group
    guards: *ground-guards
    safetyProfile: classroom-drone-monitoring
    outputRoles: *ground-roles
    parallelGroup: glasses-ground-control
    enabled: true

  - flowId: glasses-ground-right
    version: 1
    trigger:
      event: interaction.intent.device_control
      minimumConfidence: 1.0
      debounceMs: 250
      payloadEquals:
        target: ground_outputs
        action: right
        confirmed: true
    command: &ground-right-command
      action: mobility.ground.nudge
      fixedParameters: { direction: right }
      parameterBindings: []
    target: *ground-nudge-group
    guards: *ground-guards
    safetyProfile: classroom-drone-monitoring
    outputRoles: *ground-roles
    parallelGroup: glasses-ground-control
    enabled: true

  - flowId: glasses-ground-stop
    version: 1
    trigger:
      event: interaction.intent.device_control
      minimumConfidence: 1.0
      debounceMs: 100
      payloadEquals:
        target: ground_outputs
        action: stop
        confirmed: true
    command: &ground-stop-command
      action: mobility.ground.nudge
      fixedParameters: { direction: stop }
      parameterBindings: []
    target: *ground-nudge-group
    guards: *ground-guards
    safetyProfile: classroom-drone-monitoring
    outputRoles: *ground-roles
    parallelGroup: glasses-ground-control
    enabled: true

  - flowId: glasses-ground-demo
    version: 1
    trigger:
      event: interaction.intent.device_control
      minimumConfidence: 1.0
      debounceMs: 2000
      payloadEquals:
        target: ground_outputs
        action: demo
        confirmed: true
    command: &ground-demo-command
      action: mobility.ground.demonstration.start
      fixedParameters: { distanceMeters: 0.1 }
      parameterBindings: []
    target: &ground-demo-group
      roles: *ground-roles
      requiredCapability: mobility.ground.demonstration.start
    guards: *ground-guards
    safetyProfile: classroom-drone-monitoring
    outputRoles: *ground-roles
    parallelGroup: glasses-ground-control
    enabled: true

  - flowId: glasses-ground-light
    version: 1
    trigger:
      event: interaction.intent.device_control
      minimumConfidence: 1.0
      debounceMs: 250
      payloadEquals:
        target: ground_outputs
        action: light
        confirmed: true
    command: &ground-light-command
      action: robot.light.set
      fixedParameters: { red: 0, green: 180, blue: 255 }
      parameterBindings: []
    target: &ground-light-group
      roles: *ground-roles
      requiredCapability: robot.light.set
    guards: *ground-guards
    safetyProfile: classroom-drone-monitoring
    outputRoles: *ground-roles
    parallelGroup: glasses-ground-control
    enabled: true

  - flowId: glasses-tello-takeoff
    version: 1
    trigger:
      event: interaction.intent.device_control
      minimumConfidence: 1.0
      debounceMs: 1000
      payloadEquals:
        target: tello_fleet
        action: takeoff
        confirmed: true
    command: &fleet-start-command
      action: mobility.flight.fleet_sequence.start
      fixedParameters: {}
      parameterBindings: []
    target: { role: fleet_sequence_controller }
    guards: &flight-guards
      - session_is_active
      - role_is_assigned
      - target_is_connected
      - target_is_armed
      - instructor_override_is_clear
    safetyProfile: classroom-drone-monitoring
    outputRoles: [fleet_sequence_controller]
    enabled: true

  - flowId: glasses-tello-land
    version: 1
    trigger:
      event: interaction.intent.device_control
      minimumConfidence: 1.0
      debounceMs: 100
      payloadEquals:
        target: tello_fleet
        action: land
        confirmed: true
    command: &fleet-stop-command
      action: mobility.flight.fleet_sequence.stop
      fixedParameters: {}
      parameterBindings: []
    target: { role: fleet_sequence_controller }
    guards: *flight-guards
    safetyProfile: classroom-drone-monitoring
    outputRoles: [fleet_sequence_controller]
    enabled: true

  - flowId: glasses-exact-ground-forward
    version: 1
    trigger:
      event: interaction.intent.device_control
      minimumConfidence: 1.0
      debounceMs: 250
      payloadEquals:
        target: assigned_output
        action: forward
        confirmed: true
    command: *ground-forward-command
    target: &ground-nudge-exact
      roleFromPayload: targetRole
      allowedRoles: *ground-roles
      requiredCapability: mobility.ground.nudge
    guards: *ground-guards
    safetyProfile: classroom-drone-monitoring
    outputRoles: *ground-roles
    enabled: true

  - flowId: glasses-exact-ground-backward
    version: 1
    trigger:
      event: interaction.intent.device_control
      minimumConfidence: 1.0
      debounceMs: 250
      payloadEquals:
        target: assigned_output
        action: backward
        confirmed: true
    command: *ground-backward-command
    target: *ground-nudge-exact
    guards: *ground-guards
    safetyProfile: classroom-drone-monitoring
    outputRoles: *ground-roles
    enabled: true

  - flowId: glasses-exact-ground-left
    version: 1
    trigger:
      event: interaction.intent.device_control
      minimumConfidence: 1.0
      debounceMs: 250
      payloadEquals:
        target: assigned_output
        action: left
        confirmed: true
    command: *ground-left-command
    target: *ground-nudge-exact
    guards: *ground-guards
    safetyProfile: classroom-drone-monitoring
    outputRoles: *ground-roles
    enabled: true

  - flowId: glasses-exact-ground-right
    version: 1
    trigger:
      event: interaction.intent.device_control
      minimumConfidence: 1.0
      debounceMs: 250
      payloadEquals:
        target: assigned_output
        action: right
        confirmed: true
    command: *ground-right-command
    target: *ground-nudge-exact
    guards: *ground-guards
    safetyProfile: classroom-drone-monitoring
    outputRoles: *ground-roles
    enabled: true

  - flowId: glasses-exact-ground-stop
    version: 1
    trigger:
      event: interaction.intent.device_control
      minimumConfidence: 1.0
      debounceMs: 100
      payloadEquals:
        target: assigned_output
        action: stop
        confirmed: true
    command: *ground-stop-command
    target: *ground-nudge-exact
    guards: *ground-guards
    safetyProfile: classroom-drone-monitoring
    outputRoles: *ground-roles
    enabled: true

  - flowId: glasses-exact-ground-demo
    version: 1
    trigger:
      event: interaction.intent.device_control
      minimumConfidence: 1.0
      debounceMs: 2000
      payloadEquals:
        target: assigned_output
        action: demo
        confirmed: true
    command: *ground-demo-command
    target:
      roleFromPayload: targetRole
      allowedRoles: *ground-roles
      requiredCapability: mobility.ground.demonstration.start
    guards: *ground-guards
    safetyProfile: classroom-drone-monitoring
    outputRoles: *ground-roles
    enabled: true

  - flowId: glasses-exact-ground-light
    version: 1
    trigger:
      event: interaction.intent.device_control
      minimumConfidence: 1.0
      debounceMs: 250
      payloadEquals:
        target: assigned_output
        action: light
        confirmed: true
    command: *ground-light-command
    target:
      roleFromPayload: targetRole
      allowedRoles: *ground-roles
      requiredCapability: robot.light.set
    guards: *ground-guards
    safetyProfile: classroom-drone-monitoring
    outputRoles: *ground-roles
    enabled: true

  - flowId: glasses-exact-tello-takeoff
    version: 1
    trigger:
      event: interaction.intent.device_control
      minimumConfidence: 1.0
      debounceMs: 1000
      payloadEquals:
        target: assigned_output
        targetRole: fleet_sequence_controller
        action: takeoff
        confirmed: true
    command: *fleet-start-command
    target: { role: fleet_sequence_controller }
    guards: *flight-guards
    safetyProfile: classroom-drone-monitoring
    outputRoles: [fleet_sequence_controller]
    enabled: true

  - flowId: glasses-exact-tello-land
    version: 1
    trigger:
      event: interaction.intent.device_control
      minimumConfidence: 1.0
      debounceMs: 100
      payloadEquals:
        target: assigned_output
        targetRole: fleet_sequence_controller
        action: land
        confirmed: true
    command: *fleet-stop-command
    target: { role: fleet_sequence_controller }
    guards: *flight-guards
    safetyProfile: classroom-drone-monitoring
    outputRoles: [fleet_sequence_controller]
    enabled: true

  - flowId: glasses-exact-power-on
    version: 1
    trigger:
      event: interaction.intent.device_control
      minimumConfidence: 1.0
      debounceMs: 500
      payloadEquals:
        target: assigned_output
        action: power_on
        confirmed: true
    command: &power-on-command
      action: power.switch.set
      fixedParameters: { "on": true }
      parameterBindings: []
    target: &power-exact
      roleFromPayload: targetRole
      allowedRoles:
        &power-roles [
          power_output_1,
          power_output_2,
          power_output_3,
          power_output_4,
          power_output_5,
          power_output_6,
          power_output_7,
          power_output_8,
        ]
      requiredCapability: power.switch.set
    guards: &power-guards
      - session_is_active
      - role_is_assigned
      - target_is_connected
      - target_is_armed
      - instructor_override_is_clear
    safetyProfile: classroom-drone-monitoring
    outputRoles: *power-roles
    enabled: true

  - flowId: glasses-exact-power-off
    version: 1
    trigger:
      event: interaction.intent.device_control
      minimumConfidence: 1.0
      debounceMs: 100
      payloadEquals:
        target: assigned_output
        action: power_off
        confirmed: true
    command: &power-off-command
      action: power.switch.set
      fixedParameters: { "on": false }
      parameterBindings: []
    target: *power-exact
    guards: *power-guards
    safetyProfile: classroom-drone-monitoring
    outputRoles: *power-roles
    enabled: true

  - flowId: glasses-all-power-on
    version: 1
    trigger:
      event: interaction.intent.device_control
      minimumConfidence: 1.0
      debounceMs: 500
      payloadEquals:
        target: power_outputs
        action: power_on
        confirmed: true
    command: *power-on-command
    target: &power-group
      roles: *power-roles
      requiredCapability: power.switch.set
    guards: *power-guards
    safetyProfile: classroom-drone-monitoring
    outputRoles: *power-roles
    parallelGroup: glasses-power-on
    enabled: true

  - flowId: glasses-all-power-off
    version: 1
    trigger:
      event: interaction.intent.device_control
      minimumConfidence: 1.0
      debounceMs: 100
      payloadEquals:
        target: power_outputs
        action: power_off
        confirmed: true
    command: *power-off-command
    target: *power-group
    guards: *power-guards
    safetyProfile: classroom-drone-monitoring
    outputRoles: *power-roles
    parallelGroup: glasses-power-off
    enabled: true

  - flowId: glasses-activate-all-ground-demo
    version: 1
    trigger: &activate-all-trigger
      event: interaction.intent.device_control
      minimumConfidence: 1.0
      debounceMs: 2000
      payloadEquals:
        target: all_outputs
        action: activate
        confirmed: true
    command: *ground-demo-command
    target: *ground-demo-group
    guards: *ground-guards
    safetyProfile: classroom-drone-monitoring
    outputRoles: *ground-roles
    parallelGroup: glasses-activate-all
    enabled: true

  - flowId: glasses-activate-all-ground-light
    version: 1
    trigger: *activate-all-trigger
    command: *ground-light-command
    target: *ground-light-group
    guards: *ground-guards
    safetyProfile: classroom-drone-monitoring
    outputRoles: *ground-roles
    parallelGroup: glasses-activate-all
    enabled: true

  - flowId: glasses-activate-all-tello-fleet
    version: 1
    trigger: *activate-all-trigger
    command: *fleet-start-command
    target: { role: fleet_sequence_controller }
    guards: *flight-guards
    safetyProfile: classroom-drone-monitoring
    outputRoles: [fleet_sequence_controller]
    parallelGroup: glasses-activate-all
    enabled: true

  - flowId: glasses-activate-all-power
    version: 1
    trigger: *activate-all-trigger
    command: *power-on-command
    target: *power-group
    guards: *power-guards
    safetyProfile: classroom-drone-monitoring
    outputRoles: *power-roles
    parallelGroup: glasses-activate-all
    enabled: true

  - flowId: glasses-stop-all-ground
    version: 1
    trigger: &stop-all-trigger
      event: interaction.intent.device_control
      minimumConfidence: 1.0
      debounceMs: 100
      payloadEquals:
        target: all_outputs
        action: stop
        confirmed: true
    command: *ground-stop-command
    target: *ground-nudge-group
    guards: *ground-guards
    safetyProfile: classroom-drone-monitoring
    outputRoles: *ground-roles
    parallelGroup: glasses-stop-all
    enabled: true

  - flowId: glasses-stop-all-tello-fleet
    version: 1
    trigger: *stop-all-trigger
    command: *fleet-stop-command
    target: { role: fleet_sequence_controller }
    guards: *flight-guards
    safetyProfile: classroom-drone-monitoring
    outputRoles: [fleet_sequence_controller]
    parallelGroup: glasses-stop-all
    enabled: true

  - flowId: glasses-stop-all-power
    version: 1
    trigger: *stop-all-trigger
    command: *power-off-command
    target: *power-group
    guards: *power-guards
    safetyProfile: classroom-drone-monitoring
    outputRoles: *power-roles
    parallelGroup: glasses-stop-all
    enabled: true

safetyProfile: classroom-drone-monitoring
simulatorRequired: true
assessmentEvents:
  - interaction.intent.device_control
  - telemetry.motion.commanded
  - telemetry.flight.fleet_sequence.status
  - power.switch.state
fallbackBehavior: >-
  Report each unavailable output independently. Capability-gated routes skip
  actions a selected device cannot perform. Ground adapters stop through their
  local watchdog; the fleet controller validates and sequences every Tello;
  safe stop, land, and plug-off actions never require an LLM interpretation.
