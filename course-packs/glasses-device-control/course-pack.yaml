simulatorRequired: true
assessmentEvents:
  - interaction.intent.device_control
  - telemetry.motion.commanded
  - telemetry.flight.fleet_sequence.status
fallbackBehavior: >-
  Report each unavailable output independently. Ground adapters stop through
  their local watchdog; takeoff remains dormant until a tutor separately arms
  the fleet controller; a land request never requires an LLM interpretation.
