schemaVersion: "1.0"
coursePackId: glasses-device-control
version: 1.0.0
displayName: Glasses device control
description: >-
  Routes explicitly confirmed, structured G2 or Meta voice commands to assigned
  ground robots and the separately armed Tello fleet. The glasses never emit
  vendor packets or free-form motor values.

roles:
  - role: glasses_input_1
    ioType: input
    oneOfCapabilities: [interaction.intent.device_control]
    optional: false

  - role: glasses_input_2
    ioType: input
    oneOfCapabilities: [interaction.intent.device_control]
    optional: true

  - role: ground_output_1
    ioType: output
    oneOfCapabilities: [mobility.ground.nudge]
    optional: true

  - role: ground_output_2
    ioType: output
    oneOfCapabilities: [mobility.ground.nudge]
    optional: true

  - role: ground_output_3
    ioType: output
    oneOfCapabilities: [mobility.ground.nudge]
    optional: true

  - role: ground_output_4
    ioType: output
    oneOfCapabilities: [mobility.ground.nudge]
    optional: true

  - role: ground_output_5
    ioType: output
    oneOfCapabilities: [mobility.ground.nudge]
    optional: true

  - role: ground_output_6
    ioType: output
    oneOfCapabilities: [mobility.ground.nudge]
    optional: true

  - role: ground_output_7
    ioType: output
    oneOfCapabilities: [mobility.ground.nudge]
    optional: true

  - role: ground_output_8
    ioType: output
    oneOfCapabilities: [mobility.ground.nudge]
    optional: true

  - role: fleet_sequence_controller
    ioType: output
    oneOfCapabilities: [mobility.flight.fleet_sequence.start]
    optional: true

flows:
  - flowId: glasses-ground-output-1
    version: 1
    trigger: &ground-trigger
      event: interaction.intent.device_control
      minimumConfidence: 1.0
      debounceMs: 250
      payloadEquals:
        target: ground_outputs
        confirmed: true
    command: &ground-command
      action: mobility.ground.nudge
      fixedParameters: {}
      parameterBindings:
        - payloadField: action
          parameter: direction
    target: { role: ground_output_1 }
    guards: &ground-guards
      - session_is_active
      - role_is_assigned
      - target_is_connected
      - target_is_armed
      - instructor_override_is_clear
    safetyProfile: classroom-drone-monitoring
    outputRoles: [ground_output_1]
    parallelGroup: glasses-ground-control
    enabled: true

  - flowId: glasses-ground-output-2
    version: 1
    trigger: *ground-trigger
    command: *ground-command
    target: { role: ground_output_2 }
    guards: *ground-guards
    safetyProfile: classroom-drone-monitoring
    outputRoles: [ground_output_2]
    parallelGroup: glasses-ground-control
    enabled: true

  - flowId: glasses-ground-output-3
    version: 1
    trigger: *ground-trigger
    command: *ground-command
    target: { role: ground_output_3 }
    guards: *ground-guards
