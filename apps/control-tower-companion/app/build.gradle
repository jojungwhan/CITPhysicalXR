plugins {
    id "com.android.application"
}

android {
    namespace "com.cit.controltower.companion"
    compileSdk 36

    defaultConfig {
        applicationId "com.cit.controltower.companion"
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName "1.4.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        warningsAsErrors true
        // SDK and build-tool upgrades are reviewed and checksum-pinned for this device app.
        disable "AndroidGradlePluginVersion", "GradleDependency", "OldTargetApi"
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
